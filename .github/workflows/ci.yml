name: Build and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.1
        with: 
          persist-credentials: false

      - name: Set Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Generate Meta Data
        run: |
          python3 meta-data-generator.py
          python3 meta-data-generator.py kpw3

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: built
          folder: .
          clean: true
